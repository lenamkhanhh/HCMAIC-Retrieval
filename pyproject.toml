[project]
name = "hcmaic-retrieval"
version = "0.1.0"
description = "Runnable-first KIS, TRAKE and Q&A retrieval pipeline for HCMAIC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
artifacts = [
  "bm25s>=0.2,<1",
  "faiss-cpu>=1.8,<2",
  "pyarrow>=17,<22",
]
models = [
  "pillow>=10,<13",
  "torch>=2.2",
  "transformers>=4.57,<6",
]
channels = [
  "faster-whisper>=1.2,<2",
  "ultralytics>=8.3,<9",
]
rerankers = [
  "sentence-transformers>=3,<6",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
hcmaic = "hcmaic_retrieval.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcmaic_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/hcmaic_retrieval"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "bm25s", "bm25s.*", "pyarrow", "pyarrow.*", "torch", "torch.*", "transformers", "transformers.*", "PIL", "PIL.*", "ultralytics", "ultralytics.*", "faster_whisper", "faster_whisper.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
